# Frontend + same-origin Socket.IO for backyamon.com (host nginx).
#
# Install:
#   sudo cp deploy/nginx/backyamon.com.conf /etc/nginx/sites-available/backyamon.com
#   sudo ln -s /etc/nginx/sites-available/backyamon.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo certbot --nginx -d backyamon.com -d www.backyamon.com   # adds TLS (443)
#   sudo systemctl reload nginx
#
# Leaves the existing api.backyamon.com block untouched (the iOS app keeps using it).

server {
    listen 80;
    listen [::]:80;
    server_name backyamon.com www.backyamon.com;

    # Redirect www -> apex (certbot will also add the http->https redirect).
    if ($host = www.backyamon.com) {
        return 301 https://backyamon.com$request_uri;
    }

    # --- Socket.IO -> server container. Must precede the catch-all. ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # keep long-lived websockets open
    }

    # --- PWA service worker: never cache, so new versions roll out immediately. ---
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # --- Everything else -> Next.js frontend. ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
