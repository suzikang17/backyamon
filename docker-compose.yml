# Runs both apps on the VPS. Host nginx terminates TLS and reverse-proxies to
# these containers, so they bind to localhost only (not exposed publicly).
#
#   backyamon.com        -> nginx -> web    (:3000)
#   backyamon.com/socket.io & api.backyamon.com -> nginx -> server (:3001)
#
# Usage:  docker compose up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Inlined into the client bundle at build time. Same-origin: the browser
        # connects to backyamon.com and nginx routes /socket.io to the server.
        NEXT_PUBLIC_SERVER_URL: https://backyamon.com
    image: backyamon-web
    container_name: backyamon-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: backyamon-server
    container_name: backyamon-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    # SQLite DB file, persisted on the host so it survives container rebuilds.
    # Requires TURSO_DATABASE_URL=file:/data/backyamon.db in .env.
    # (Assets live in Cloudflare R2 — only the DB needs a volume.)
    volumes:
      - ./data:/data
